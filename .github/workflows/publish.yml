name: Instagram 자동 게시

on:
  schedule:
    - cron: "5,35 * * * *"   # 30분마다 확인 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      folder:
        description: "지금 바로 게시할 queue 폴더 이름 (비우면 시간이 된 게시물 1개)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 최신 상태로 맞추기 (중복 게시 방지)
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          echo "IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py --folder "${{ github.event.inputs.folder }}"

      - name: 게시 기록 저장
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "today-dudeoji-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A queue published
            git commit -m "게시 완료 기록"
            git push
          fi
