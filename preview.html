<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 두더지 미리보기</title>
<link rel="stylesheet" href="template/style.css">
<style>
  html, body { width: auto; height: auto; overflow: auto; background: #E9E4D6; }
  .bar { padding: 20px 28px; font: 700 18px 'Noto Sans KR', sans-serif; color: #22401F;
         display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .bar select, .bar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 2px solid #22401F; background: #fff; }
  .grid { display: flex; flex-wrap: wrap; gap: 22px; padding: 0 28px 40px; }
  .slot { width: 432px; height: 540px; overflow: hidden; border-radius: 14px;
          box-shadow: 0 6px 18px rgba(0,0,0,.18); background: #fff; position: relative; }
  .slot .card { transform: scale(.4); transform-origin: top left; }
  .slot.big { width: 1080px; height: 1350px; }
  .slot.big .card { transform: none; }
  .caption { margin: 0 28px 40px; padding: 20px 24px; background: #fff; border-radius: 14px;
             white-space: pre-wrap; font: 500 16px/1.6 'Noto Sans KR', sans-serif; max-width: 920px; }
  .err { color: #c00; padding: 28px; font: 700 18px sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="bar">
  오늘의 두더지 미리보기
  <label>원고 <select id="post"></select></label>
  <button id="toggle">원본 크기로 보기</button>
</div>
<div class="grid" id="grid"></div>
<div class="caption" id="caption"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<em>$1</em>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const lines = v => Array.isArray(v) ? v.map(fmt).join('<br>') : fmt(v);
const head = (i, n) => `<div class="head"><div class="logo"></div><div class="brand">오늘의 <span>두더지</span></div><div class="page">${i} / ${n}</div></div>`;

function cardHtml(c, i, n, handle) {
  switch (c.type) {
    case 'cover': return `<div class="card cover"><div class="art"></div><div class="panel">
        <div class="tag">${fmt(c.tag)}</div><h1>${lines(c.title)}</h1><div class="sub">${lines(c.sub)}</div></div>
        <div class="foot"><span>${fmt(handle)}</span><span class="swipe">넘겨보기 →</span></div></div>`;
    case 'body': {
      let list = '';
      if (c.items) list += '<div class="items">' + c.items.map(it =>
        `<div class="item"><div class="num">${fmt(it.num)}</div><div><div class="t">${lines(it.title)}</div><div class="d">${lines(it.desc)}</div></div></div>`).join('') + '</div>';
      if (c.bullets) list += '<ul class="bullets">' + c.bullets.map(b => `<li>${fmt(b)}</li>`).join('') + '</ul>';
      return `<div class="card body">${head(i, n)}<div class="inner"><div class="label">${fmt(c.label)}</div>
        <h2>${lines(c.heading)}</h2>${list}</div><div class="foot-handle">${fmt(handle)}</div></div>`;
    }
    case 'checklist': return `<div class="card checklist">${head(i, n)}<div class="inner"><div class="label">${fmt(c.label)}</div>
        <h2>${lines(c.heading)}</h2><ul class="checks">${c.items.map(t => `<li><span class="box"></span><span>${fmt(t)}</span></li>`).join('')}</ul>
        <div class="save-note"><span>${fmt(c.note)}</span></div></div><div class="foot-handle">${fmt(handle)}</div></div>`;
    case 'follow': return `<div class="card follow"><div class="top">${fmt(c.top || '[[내 돈·생활 이슈]], 두더지가 캐드려요')}</div>
        <div class="art"></div><div class="bottom">${fmt(handle)}</div></div>`;
    default: return `<div class="err">알 수 없는 카드 type: ${esc(c.type)}</div>`;
  }
}

async function load(name) {
  const grid = document.getElementById('grid'), cap = document.getElementById('caption');
  try {
    const res = await fetch(`posts/${encodeURIComponent(name)}.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`posts/${name}.json 을 찾을 수 없습니다`);
    const data = await res.json();
    const handle = data.handle || '@today_dudeoji', cards = data.cards || [];
    grid.innerHTML = cards.map((c, k) => `<div class="slot">${cardHtml(c, k + 1, cards.length, handle)}</div>`).join('');
    cap.textContent = data.caption || '';
  } catch (e) { grid.innerHTML = `<div class="err">${esc(e.message)}</div>`; cap.textContent = ''; }
}

async function init() {
  const sel = document.getElementById('post');
  const params = new URLSearchParams(location.search);
  let names = [];
  try { names = await (await fetch('posts/index.json', { cache: 'no-store' })).json(); } catch { names = ['sample']; }
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  sel.value = params.get('post') || names[0];
  sel.onchange = () => { history.replaceState(null, '', `?post=${encodeURIComponent(sel.value)}`); load(sel.value); };
  document.getElementById('toggle').onclick = () => document.querySelectorAll('.slot').forEach(s => s.classList.toggle('big'));
  load(sel.value);
}
init();
</script>
</body>
</html>
